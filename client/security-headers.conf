# Säkerhetsheaders (M8, A02 Security Misconfiguration). Inkluderas i VARJE location i nginx.conf.template:
# nginx ärver inte add_header från server-blocket så fort en location har en egen add_header
# (det har /assets/ – Cache-Control). Glöms en location saknar den alla headrar här.
#
# CSP: bara våra egna skript och stilar, inga inline-skript. Ett skript som ändå slinker in via
# redaktionens HTML (v-html i GuideDetailView, skuld 10) körs inte – browsern vägrar.
# 'unsafe-inline' för stilar behövs av Vues scoped styles i utvecklingsläge; i produktion ligger
# stilarna i CSS-filer, men v-html-innehållet kan ha style-attribut.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;
add_header X-Content-Type-Options "nosniff" always;       # browsern gissar inte innehållstyp (en "bild" som är ett skript körs inte)
add_header X-Frame-Options "DENY" always;                 # äldre browsrar: samma sak som frame-ancestors 'none' (clickjacking)
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
# HSTS sätts inte här: staging i Azure får https av plattformen, lokalt kör vi http. Sätt den i
# produktion, när ni vet att allt är https: add_header Strict-Transport-Security "max-age=31536000" always;